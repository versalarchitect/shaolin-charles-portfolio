<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Charles Jackson — Agentic Systems Engineer</title>
    <meta
      name="description"
      content="Charles Jackson — engineer and founder building agentic systems, and the companies around them."
    />

    <meta name="theme-color" content="#f3f2f0" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://charlesjackson.dev" />
    <meta property="og:title" content="Charles Jackson — Agentic Systems Engineer" />
    <meta property="og:description" content="Engineer and founder building agentic systems." />
    <meta name="twitter:card" content="summary_large_image" />

    <script>
      // FOUC-free theme. Default is LIGHT: stay light unless the user explicitly
      // chose dark, or chose "system" and the OS prefers dark.
      (function () {
        try {
          var t = localStorage.getItem('theme')
          var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          if (dark) document.documentElement.classList.add('dark')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
